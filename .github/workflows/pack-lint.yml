name: Pack Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-id-collisions:
    name: R4 — ID collision detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for ID collisions
        run: bash .github/scripts/check-pack-collisions.sh

  architecture-registry:
    name: Architecture registry — links valid, view up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: Check registry
        run: python3 .github/scripts/architecture-registry.py check
