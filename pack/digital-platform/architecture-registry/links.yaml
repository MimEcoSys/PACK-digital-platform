paths:
- id: '10'
  need: Участник оплачивает подписку (ветка ЮKassa, DP.ARCH.001 §10)
  steps:
  - from: ЮKassa
    action: присылает уведомление о платеже
    to: payment-receiver
  - from: payment-receiver
    action: пересылает событие
    to: event-gateway
  - from: event-gateway
    action: пишет в learning.domain_event
    to: db:learning
  - from: multi-domain-projection-worker
    action: читает событие
    to: db:learning
  - from: multi-domain-projection-worker
    action: записывает подписку
    to: db:subscription
  - from: gateway-mcp
    action: читает право при вызове
    to: db:subscription
- id: 10-вход
  need: Участник оплачивает подписку (входы, DP.ARCH.001 §11.2 Б строка 10)
  steps:
  - from: aist_bot_newarchitecture
    action: команды /buy, /subscribe_stars, /subscription
    to: Telegram Stars
  - from: system-school.ru
    action: страница /quick-purchase (модуль страницы не установлен)
    to: ЮKassa
  note: как оплата через Telegram Stars доходит до базы subscription — в DP.ARCH.001 не установлено; §11.2 не называет Кассира для этой потребности
