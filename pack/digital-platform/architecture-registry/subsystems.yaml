source: DP.ARCH.001 §4.1, §5.1, §5.3, §11.1а, PACK-digital-platform origin/main 19.11.2026; перенос РП-611 Ф34; сторона IWE — DP.ARCH.001 §4.2, §5.2, §11.1, PACK-digital-platform origin/main 21.11.2026;
  перенос РП-616 Ф7
subsystems:
- id: gatekeeper
  name: Привратник
  aliases: []
  system: платформа
  status: существует
  purpose: устанавливает личность, тариф и права
- id: tool-dispatcher
  name: Диспетчер инструментов
  aliases: []
  system: платформа
  status: существует
  purpose: принимает вызовы MCP и передаёт их нужному бэкенду
- id: shared-knowledge-provider
  name: Поставщик общих знаний
  aliases: []
  system: платформа
  status: существует
  purpose: ищет и выдаёт паки, руководства, понятия
- id: librarian
  name: Библиотекарь
  aliases: []
  system: платформа
  status: проектируется
  purpose: хранит указатели на методы авторов из собрания «Библиотека методов» и их проверку (имя подсистемы — по роли, решение пилота 11.11.2026); определение — [ECO.ARCH.001 §3.1 «Библиотека методов»](https://github.com/MimEcoSys/PACK-ecosystem/blob/main/pack/ecosystem/02-domain-entities/ECO.ARCH.001-ecosystem-architecture.md)
- id: personal-knowledge-keeper
  name: Хранитель личных знаний
  aliases: []
  system: платформа
  status: существует
  purpose: индексирует и отдаёт личные и командные источники
- id: portrait-keeper
  name: Держатель портрета
  aliases: []
  system: платформа
  status: существует
  purpose: хранит характеристики и ступень человека
- id: path-guide
  name: Проводник по пути
  aliases: []
  system: платформа
  status: существует
  purpose: 'ведёт человека: онбординг, чек-лист, руководство, тренажёр'
- id: event-accountant
  name: Учётчик событий
  aliases: []
  system: платформа
  status: существует
  purpose: принимает события и раскладывает их по базам, начисляет баллы
- id: cashier
  name: Кассир
  aliases: []
  system: платформа
  status: существует
  purpose: принимает платежи и ведёт подписки
- id: mentor-workplace
  name: Рабочее место наставника
  aliases: []
  system: платформа
  status: существует
  purpose: даёт наставнику карточку участника и разбор чата
- id: server-agent-runner
  name: Исполнитель серверных агентов
  aliases: []
  system: платформа
  status: существует
  purpose: выполняет работу агентов по поручению и расписанию
- id: model-dispenser
  name: Раздатчик моделей
  aliases: []
  system: платформа
  status: существует
  purpose: проверяет лимит и передаёт вызовы моделям
- id: messenger
  name: Собеседник в мессенджере
  aliases: []
  system: платформа
  status: существует
  purpose: ведёт диалог с человеком в Telegram
- id: herald
  name: Вестник
  aliases: []
  system: платформа
  status: существует
  purpose: 'доставляет уведомления всем пользователям по правилам платформы и по своим правилам человека: хранит правила и настройки, принимает выпуски, решает, когда и в какой канал доставить, ведёт ленту
    и учёт доставки (решение пилота 18.11.2026)'
- id: showcase
  name: Витрина
  aliases: []
  system: платформа
  status: существует
  purpose: рассказывает о программах и ведёт к подключению
- id: translator
  name: Переводчик
  aliases: []
  system: платформа
  status: существует
  purpose: переводит для всех тексты шаблона IWE и карточки Библиотеки методов на английский по утверждённому словарю понятий; отдаёт словарь для инструкции ИИ клиента Open (решение пилота 10.11.2026, вариант
    «обе системы»)
- id: health-watchman
  name: Сторож исправности
  aliases: []
  system: платформа
  status: существует
  purpose: замечает сбои и сообщает о них
- id: backup-keeper
  name: Хранитель копий
  aliases: []
  system: платформа
  status: существует
  purpose: держит резервные копии и подтверждение целостности
- id: conversation-window
  name: Окно разговора
  aliases: []
  system: платформа
  status: проектируется
  purpose: принимает сообщения человека в мессенджере и показывает ответы; рабочее имя (заявка РП-262, И-61 во входящих РП-611, 19.11.2026); окончательное имя и отношение к подсистеме «Собеседник в мессенджере»
    — решение пилота
- id: interlocutor
  name: Собеседник
  aliases: []
  system: платформа
  status: проектируется
  purpose: 'ведёт разговор с человеком о его личном IWE в обе стороны: отвечает, предлагает, пишет первым; рабочее имя (заявка РП-262, И-61 во входящих РП-611, 19.11.2026); окончательное имя и отношение
    к подсистеме «Собеседник в мессенджере» — решение пилота'
- id: write-controller
  name: Контролёр записи
  aliases: []
  system: платформа
  status: проектируется
  purpose: 'выдаёт одноразовые разрешения на запись в шлюзе: запись только после явного подтверждения человека; рабочее имя (заявка РП-262, И-61 во входящих РП-611, 19.11.2026); окончательное имя и отношение
    к подсистеме «Собеседник в мессенджере» — решение пилота'
- id: interlocutor-executor-choice
  name: Выбор исполнителя Собеседника
  aliases: []
  system: платформа
  status: проектируется
  purpose: 'по настройке человека выбирает исполнителя Собеседника: агент платформы или собственный агент владельца; рабочее имя (заявка РП-262, И-61 во входящих РП-611, 19.11.2026); окончательное имя и
    отношение к подсистеме «Собеседник в мессенджере» — решение пилота'
- id: work-executor
  name: Исполнитель работы
  aliases: []
  system: IWE
  status: существует
  purpose: 'выполняет задачи пользователя действиями агента; где есть: ядро'
- id: context-loader
  name: Загрузчик контекста
  aliases: []
  system: IWE
  status: существует
  purpose: 'подаёт агенту инструкции и память по событиям сессии, держит резервную копию памяти (прежнее имя — экзокортекс); где есть: ядро'
- id: knowledge-router
  name: Маршрутизатор знаний
  aliases: []
  system: IWE
  status: существует
  purpose: 'определяет место хранения для каждой единицы знания и артефакта; где есть: ядро'
- id: task-router
  name: Маршрутизатор задач
  aliases: []
  system: IWE
  status: существует
  purpose: 'передаёт задачу нужному исполнителю: скрипту, модели или скиллу; где есть: ядро'
- id: secrets-guard
  name: Защитник секретов
  aliases: []
  system: IWE
  status: существует
  purpose: 'не пропускает секреты и личные данные в команды, вывод и коммиты; проверяет согласие на доступ к личным данным; где есть: ядро; описание метода в шаблоне: .claude/skills/check-secret/'
- id: registry-controller
  name: Контролёр реестров
  aliases: []
  system: IWE
  status: существует
  purpose: 'обнаруживает расхождения установки с манифестом шаблона; где есть: ядро'
- id: background-attendant
  name: Фоновый дежурный
  aliases: []
  system: IWE
  status: существует
  purpose: 'запускает работы по времени и событиям и сигналит пользователю; где есть: ядро; описание метода в шаблоне: .claude/skills/day-open/'
- id: installation-inspector
  name: Техосмотрщик
  aliases: []
  system: IWE
  status: существует
  purpose: 'проверяет установку и выдаёт заключение; где есть: ядро; описание метода в шаблоне: .claude/skills/audit-installation/'
- id: work-accountant
  name: Учётчик работы
  aliases: []
  system: IWE
  status: существует
  purpose: 'ведёт сессии, рабочие продукты, реестр и журнал дня; где есть: ядро'
- id: agent-coordinator
  name: Координатор агентов
  aliases: []
  system: IWE
  status: существует
  purpose: 'разграничивает правки параллельных агентов, изолирует их, выстраивает публикацию, ведёт диалог агентов; где есть: ядро'
- id: update-deliverer
  name: Доставщик обновлений
  aliases: []
  system: IWE
  status: существует
  purpose: 'доставляет обновления шаблона в установку пользователя; где есть: ядро; описание метода в шаблоне: .claude/skills/iwe-update/'
- id: knowledge-loader
  name: Загрузчик знаний
  aliases: []
  system: IWE
  status: существует
  purpose: 'получает для агента документы паков и личных знаний; где есть: ядро'
- id: clarity-controller
  name: Контролёр ясности
  aliases: []
  system: IWE
  status: существует
  purpose: 'проверяет ответы агента пользователю на понятность; где есть: по выбору'
- id: work-board
  name: Табло работы
  aliases: []
  system: IWE
  status: существует
  purpose: 'показывает пользователю состояние рабочих продуктов в редакторе; где есть: по выбору'
- id: time-recorder
  name: Учётчик времени
  aliases: []
  system: IWE
  status: существует
  purpose: 'отмечает время работы пользователя в рантайме и редакторе; где есть: по выбору; описание метода в шаблоне: .claude/skills/setup-wakatime/'
- id: detector
  name: Детектор
  aliases: []
  system: IWE
  status: существует
  purpose: 'на событиях рантайма запускает зарегистрированные детекторы и записывает найденные ими события (инциденты, кандидаты в знания); где есть: ядро'
- id: agent-reasoning-log
  name: Учёт рассуждений агента
  aliases: []
  system: IWE
  status: существует
  purpose: 'записывает следы действий и рассуждений агента по сессиям, выдаёт их для просмотра, поиска и разбора; где есть: по выбору (запись по умолчанию выключена, включает пользователь)'
- id: iwe-translator
  name: Переводчик
  aliases: []
  system: IWE
  status: существует
  purpose: 'переводит на английский тексты пользователя по утверждённому словарю понятий и показывает неутверждённые имена отдельным списком; где есть: по выбору (тот же Переводчик работает и как подсистема
    платформы, §4.1)'
- id: version-keeper
  name: Хранитель версий
  aliases: []
  system: IWE
  status: существует
  purpose: 'хранит файлы пользователя с историей версий и возвращает прежние версии; где есть: ядро (модули — git и файловая система компьютера, git требует любая установка по шаблону; GitHub — система
    окружения, §5.4)'
- id: iwe-repairer
  name: Наладчик IWE
  aliases: []
  system: IWE
  status: существует
  purpose: 'восстанавливает память и инструкции агента из резервной копии на новом компьютере или после порчи; где есть: ядро; починка типовых сбоев по каталогу (обещание DP.SC.008) пока работает только
    в установке автора; описание метода в шаблоне: .claude/skills/iwe-restore/, .claude/skills/restore-exocortex/'
- id: verifier
  name: Верификатор
  aliases: []
  system: IWE
  status: существует
  purpose: 'проверяет результат по эталону отдельным запуском агента, который не видел работы; где есть: ядро; описание метода в шаблоне: .claude/skills/verify/'
