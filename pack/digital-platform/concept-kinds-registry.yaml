# Реестр «понятие → род» для проверки онтологической чистоты ответов (правило A14, РП-388 Ф21)
#
# Зачем: правило 8 базы стиля (communication-style-base.md) запрещает «входит в / состоит из /
# часть» применять к несистемным родам и смешивать роды в одном перечислении. Чтобы проверка
# не знала понятий «в коде», список понятий живёт здесь, а детектор читает его копию
# (.claude/hooks/lib/concept-kinds.tsv, генерируется скриптом scripts/build-concept-kinds-tsv.py).
# Первоисточник — этот файл; копию руками не править (OwnerIntegrity).
#
# РАЗМЕЩЕНИЕ: доменный словарь этого Pack, сиблинг routing.yaml и result-kinds-registry.yaml
# (машинный контракт, не нарративная карточка DP.*). Прецедент — решение пилота 05.08.2026.
# ИМЯ: «Реестр понятий и родов» — подтверждено пилотом 23.10.2026; имя файла — по образцу result-kinds-registry.yaml.
#
# ОПОРА НА FPF (копия 22b6756 от 2026-10-06, служба на снимке 2026-10-23):
#   C.3 / C.3.1 — род есть различение (область кандидатов + условие принадлежности + граница),
#                 а не слово; слово даёт только подсказку (A.7:5.3);
#   C.3.2       — суждение да / нет / неизвестно / неприменимо → род «ambiguous» вместо угадывания;
#   E.10        — перегруженные слова (context, role, process, method, result, record, status);
#   A.7:5.6, A.14 — четыре разных отношения «часть», набор и коллектив частью не являются;
#   A.7:5.4     — описание не действует.
#
# ПРАВИЛА РЕЕСТРА:
#   1. Слово без проверочного вопроса (test) в реестр не попадает: слово — подсказка, решает вопрос.
#   2. Неоднозначное слово получает род «ambiguous»; детектор по нему НЕ блокирует. «ambiguous» — не вид
#      по FPF, а исход суждения «неизвестно / неприменимо» (C.3.2) плюс перегруженная голова (E.10);
#      он лежит в списке родов ради единообразия записей.
#   3. Род «состояние» оставлен по паку (решение пилота 23.10.2026): состояние — система в данный
#      момент; набор значений характеристик — описание состояния. В тексте FPF A.19 «состояние» —
#      точка пространства характеристик, обобщённого вида «состояние» FPF не вводит (C.26,
#      CC-C26.10). Это терминологическое решение домена, не вывод из FPF.
#   4. Нет подходящего рода → кандидат в новую запись с проверочным вопросом, не «прочее».
#   5. Статус записи: pilot — назвал пилот; pack — следует из типа записи пака; fpf — следует из
#      FPF; draft — черновик агента, подтверждения пилота нет.
#
#   6. Только род «система» можно назвать системой (A14, решение пилота 24.10.2026): проект, процесс,
#      метод, жизнь и любая деятельность системой не называются. Верно: «система, которая ведёт проект»
#      или «система, которая создаётся в проекте».
#
# also — необязательное поле: другие употребления того же слова по контексту [{kind, when}]. Идентичность вещи одна,
#        род зависит от того, что утверждается (FPF A.1:4.9: заполнение роли новый вид не создаёт). Детектор поле
#        не читает: оно для человека и для будущих проверок «слово в этом предложении употреблено как ...».
# stems — регулярные выражения (Perl), к которым детектор добавляет левую границу слова.
# Допустимые символы: русские и латинские буквы нижнего регистра, цифры, пробел и [ ] ( ) ? | - !

schema_version: 1

kinds:
  - id: system
    name: система
    test: "Это организованное целое, участвующее в работе и сохраняющее тождество при замене частей (A.1:4.4)? Для физических систем: можно отключить от питания или унести."
    part_relation: "ComponentOf: «входит в», «состоит из», «часть», «компонент» допустимы между системами"
  - id: description
    name: описание
    test: "Это утверждения о конкретном предмете, которые сами ничего не делают и могут лежать в нескольких файлах (A.1:4.5, C.2.1)?"
    part_relation: "ConstituentOf: раздел, утверждение; «часть системы» — ошибка"
  - id: document
    name: документ
    test: "Это физический или цифровой носитель описания: файл, том, набор данных (A.7:5.5)?"
    part_relation: "раздел, страница; «часть системы» — ошибка"
  - id: method
    name: метод
    test: "Это многоразовый способ действия, не событие и не его запись?"
    part_relation: "подметод (B.1.5); метка шага частью метода не является (A.1:4.3); «часть системы» — ошибка"
  - id: work
    name: работа
    test: "Это одно конкретное действие: названа система, которая его выполнила, метод, по которому она действовала, и интервал времени (A.15.1)? План, журнал, результат и запись о действии работой не являются."
    part_relation: "этап, временная часть (A.15.1)"
  - id: work_plan
    name: план работы
    test: "Это намеченный порядок будущей работы, ещё не описание метода и не сама работа?"
    part_relation: "пункт плана"
  - id: activity
    name: деятельность
    test: "Это то, что система делает во времени (проект, процесс, жизнь), а не система и не отдельный прогон? По решению пилота 24.10.2026 деятельность ведёт система."
    part_relation: "этап, шаг; система ведёт деятельность или создаётся в ней, но деятельностью не является"
  - id: state
    name: состояние
    test: "Это система в данный момент (решение пака, 23.10.2026)?"
    part_relation: "частей нет; набор значений — описание состояния"
  - id: characteristic
    name: характеристика
    test: "Это измеряемый аспект системы: что меряем?"
    part_relation: "частей нет"
  - id: characteristic_value
    name: значение характеристики
    test: "Это число или уровень на шкале, фиксируемый в описании?"
    part_relation: "частей нет"
  - id: role_kind
    name: роль (вид)
    test: "Это класс систем по вкладу в работу (вид), а не конкретная система и не назначение этой роли системе? Вид и назначение — два разных объекта (A.2, A.2.1)."
    part_relation: "частью системы не бывает"
  - id: capability
    name: способность
    test: "Это ограниченная способность конкретной системы выполнять класс работ при названных условиях и мерах (A.2.2)?"
    part_relation: "частью системы не бывает"
  - id: collection
    name: совокупность
    test: "Это список, набор или перечень: принадлежность по правилу самой совокупности, а не часть и не система (A.7:5.6, A.1:4.7)?"
    part_relation: "«belongs-to» не часть и не целое; действующая группа — система только после шести проверок A.1 (см. слово «команда» в неоднозначных)"
  - id: ambiguous
    name: неоднозначно
    test: "Какой объект имеется в виду? Назвать его и отнести к роду, прежде чем применять правила частей. Исход суждения «неизвестно», не вид (C.3.2)."
    part_relation: "не проверяется"

terms:
  # ---- системы ----
  - {term: агент, kind: system, stems: [агент], status: pilot, basis: "решение пилота 29.10: действующая система — человек, ИИ-агент, команда, организация (FPF A.13:4.1, MIMDEV1:1); Tier-A «Агент ≠ Роль»"}
  - {term: инструмент, kind: system, stems: [инструмент], status: pilot, basis: "ответ 1A принят 23.10"}
  - {term: сервер, kind: system, stems: [сервер], status: pilot, basis: "тест «отключить от питания»"}
  - {term: бот, kind: system, stems: [бот], status: pilot, basis: "подтверждено пилотом 23.10: работающая программа"}
  - {term: шлюз, kind: system, stems: [шлюз], status: pilot, basis: "подтверждено пилотом 23.10: работающая программа"}
  - {term: человек, kind: system, stems: [человек, пилот], status: fpf, basis: "A.1", also: [{kind: role_kind, when: "назван по вкладу в работу («пилот», «автор»)"}]}
  - {term: молоток, kind: system, stems: [молоток, молотк], status: pilot, basis: "пример пилота 23.10: одна вещь, три употребления; FPF A.1:4.9 — заполнение роли вид не меняет", also: [{kind: role_kind, when: "по вкладу в работу («молоток — инструмент забивания»)"}, {kind: ambiguous, when: "назван предметом («молоток лежит на столе»): в FPF это U.Entity без суждения о системности"}]}
  - {term: компьютер, kind: system, stems: [компьютер, "мак(?![а-яё])"], status: pilot, basis: "физическая система"}
  - {term: программа, kind: system, stems: [программ], status: pilot, basis: "решение пилота 31.10 (РП-616 Ф3): программа — запущенный на железе файл, тогда она система; незапущенный файл программы — документ", also: [{kind: document, when: "файл программы, не запущенный («программа лежит в репозитории»)"}, {kind: ambiguous, when: "программа развития, учебная программа — не программа для компьютера; назвать объект"}]}
  - {term: скрипт, kind: system, stems: [скрипт], status: pilot, basis: "решение пилота 31.10 (РП-616 Ф3): скрипт — программа; запущенный на железе — система", also: [{kind: document, when: "файл скрипта, не запущенный"}]}
  - {term: хук, kind: system, stems: [хук], status: pilot, basis: "решение пилота 31.10 (РП-616 Ф3): хук — программа, которую запускает рантайм агента по событию; запущенный — система", also: [{kind: document, when: "файл хука, не запущенный"}]}
  # ---- описания ----
  - {term: промпт, kind: description, stems: [промпт], status: pilot, basis: "решение 23.10: содержание, которому следует агент"}
  - {term: инструкция, kind: description, stems: [инструкци], status: pilot, basis: "правило 8"}
  - {term: ответ, kind: description, stems: [ответ], status: pilot, basis: "пример пилота 23.10: «ответ делится на две части» → «в ответе два раздела»; содержание ответа, а не файл"}
  - {term: правило, kind: description, stems: [правил], status: pilot, basis: "правило 8"}
  - {term: чеклист, kind: description, stems: [чеклист, критери, требовани], status: pilot, basis: "правило 8"}
  - {term: протокол, kind: description, stems: [протокол], status: pilot, basis: "ответ 7C принят: описание метода"}
  - {term: описание, kind: description, stems: [описани], status: pilot, basis: "правило 8"}
  - {term: пак, kind: description, stems: ["пак[аиеу]?(?![а-яё])"], status: pilot, basis: "ответ 8C принят"}
  - {term: принцип, kind: description, stems: [принцип, различени], status: pack, basis: "328 различений в паке"}
  - {term: знание, kind: description, stems: [знани], status: pack, basis: "тип записи пака"}
  - {term: память агента, kind: description, stems: [памят], status: pilot, basis: "ответ 1A принят: содержание; носитель — файлы и база. Компьютерная память — система: «память входит в компьютер» верна, возможно ложное срабатывание"}
  - {term: обещание, kind: description, stems: [обещани], status: fpf, basis: "A.2.3: promise content (service offering clause) — описание, не система и не работа"}
  # ---- документы ----
  - {term: файл, kind: document, stems: [файл, страниц], status: pilot, basis: "правило 8"}
  - {term: журнал, kind: document, stems: [журнал, реестр, карточк], status: pack, basis: "носитель записей"}
  - {term: документ, kind: document, stems: [документ], status: pack, basis: "правило 8: документ - носитель описания; приёмка Ф21 (31.10): «состоит из ... документации» не ловилось, слова не было в реестре"}
  # ---- методы ----
  - {term: метод, kind: method, stems: [метод], status: pilot, basis: "правило 8; A.3.1. Слово «method» в перечне перегруженных голов E.10 — при сомнении уточнить: метод, его описание, план или работа"}
  - {term: ритуал, kind: method, stems: [ритуал], status: pilot, basis: "Tier-A: ритуал ОРЗ"}
  - {term: управление выполнением, kind: method, stems: ["управлени[ея] выполнени"], status: pilot, basis: "пример пилота 19.10: способ действия, не часть агента; в тексте FPF вид не установлен"}
  # ---- работа ----
  - {term: прогон, kind: work, stems: [прогон, запуск, "работ[аыуе](?![а-яё])"], status: pilot, basis: "правило 8: произошло в период; A.15.1"}
  # ---- план работы (FPF A.15; пак называл описанием — берём по FPF, решение пилота 23.10) ----
  - {term: план, kind: work_plan, stems: [план], status: fpf, basis: "A.15: WorkPlan ≠ MethodDescription ≠ Work"}
  # ---- деятельность (решение пилота 24.10.2026: проект, процесс, метод и любая деятельность не система; жизнь тоже) ----
  - {term: проект, kind: activity, stems: ["проект(а|у|ом|е|ы|ов|ам|ами|ах)?(?![а-яё])"], status: pilot, basis: "решение пилота 24.10: проект - деятельность, не система; система - та, что ведёт проект или создаётся в нём"}
  - {term: процесс, kind: activity, stems: [процесс], status: pilot, basis: "решение пилота 24.10: процесс - деятельность, не система (раньше стоял среди неоднозначных по E.10; метод, описание метода и план - отдельные роды)"}
  - {term: деятельность, kind: activity, stems: [деятельност], status: pilot, basis: "решение пилота 24.10: любая деятельность - не система"}
  - {term: жизнь, kind: activity, stems: ["жизн(ь|и|ью|ей)(?![а-яё])"], status: pilot, basis: "решение пилота 24.10: жизнь - деятельность, не система"}
  # ---- состояние, характеристика, значение ----
  - {term: состояние, kind: state, stems: [состояни], status: pilot, basis: "решение пилота 23.10: есть состояние системы"}
  - {term: характеристика, kind: characteristic, stems: [характеристик], status: fpf, basis: "A.17"}
  - {term: показатель, kind: characteristic_value, stems: [показател, ступен, мультипликатор], status: pilot, basis: "значения характеристик «мастерство» (ступень, FPF A.18 — уровень шкалы), «выработка» (мультипликатор); подтверждено пилотом 23.10. «Тир» убран: это свойство человека, не значение шкалы"}
  # ---- роль, способность ----
  - {term: роль, kind: role_kind, stems: ["рол[ьиеюя](?![а-яё])"], status: pilot, basis: "Tier-A «Агент ≠ Роль»; FPF A.2 (вид) и A.2.1 (назначение). Слово «role» в перечне перегруженных голов E.10"}
  - {term: скилл, kind: capability, stems: [скилл, способност], status: pilot, basis: "Tier-A «Скилл»: способность; SKILL.md — документ"}
  # ---- совокупности ----
  - {term: список, kind: collection, stems: [список, набор, перечен, совокупност], status: fpf, basis: "A.7:5.6"}
  # ---- неоднозначные слова: детектор не блокирует ----
  - {term: функция, kind: ambiguous, stems: [функци], status: fpf, basis: "A.7:5.2", resolve: "вид, поведение, способность или преобразование?"}
  - {term: контекст, kind: ambiguous, stems: [контекст], status: fpf, basis: "E.10", resolve: "подаваемое модели описание, ограниченный контекст FPF или состояние?"}
  - {term: результат, kind: ambiguous, stems: [результат, статус], status: fpf, basis: "E.10"}
  - {term: запись, kind: ambiguous, stems: [запис], status: fpf, basis: "E.10", resolve: "содержание записи (описание) или документ с ней?"}
  - {term: отчёт, kind: ambiguous, stems: ["отч[её]т"], status: pilot, basis: "подтверждено пилотом 23.10: содержание — описание, файл — документ"}
  - {term: репозиторий, kind: ambiguous, stems: [репозитори], status: pilot, basis: "подтверждено пилотом 23.10: совокупность документов; хранилище не действует"}
  - {term: гейт, kind: ambiguous, stems: [гейт], status: fpf, basis: "A.21", resolve: "проверка (метод), её запуск (работа) или решение по ней?"}
  - {term: конвейер, kind: ambiguous, stems: [конвейер], status: pilot, basis: "подтверждено пилотом 23.10: система, метод или совокупность"}
  - {term: сессия, kind: ambiguous, stems: [сесси], status: pilot, basis: "подтверждено пилотом 23.10: период работы или запись о нём"}
  - {term: закрытие дня, kind: ambiguous, stems: [закрыти, открыти], status: pilot, basis: "подтверждено пилотом 23.10: метод вообще или работа вчера"}
  - {term: модель, kind: ambiguous, stems: ["модел[ьиею]"], status: fpf, basis: "E.10: «model hides the question»", resolve: "обученная сеть (система) или описание?"}
  - {term: платформа, kind: system, stems: [платформ], status: pilot, basis: "решение пилота 31.10 (РП-388 Ф34): платформа - система, как и IWE (среда - тоже система); прежняя запись «неоднозначно» (C.3.2: принадлежность не установлена) снята"}
  - {term: модуль, kind: system, stems: [модул], status: pilot, basis: "решение пилота 31.10 (РП-616 Ф3): модуль — конструктивная часть системы, которую можно заменить; прежнее замечание 23.10 (функциональная природа не названа) снято разведением функциональных и модульных подсистем. Учебный «модуль» — дидактика, в паке запрещён (SPF hard ban)", also: [{kind: description, when: "исходный код модуля как описание способа действия"}, {kind: document, when: "файл модуля, не запущенный"}, {kind: ambiguous, when: "учебный модуль курса — назвать объект"}]}
  - {term: база данных, kind: ambiguous, stems: ["баз[аеыу] данных"], status: pilot, basis: "замечание пилота 23.10: как физический объект, функция не названа; FPF A.1:4.4, A.7:5.3", resolve: "работающая СУБД (система), её содержимое (записи, описание) или файл на диске (носитель)?"}
  - {term: хранилище, kind: ambiguous, stems: [хранилищ], status: pilot, basis: "по тому же замечанию пилота 23.10, что модуль и база данных", resolve: "работающая служба хранения (система), содержимое (описание) или физический носитель?"}
